name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synctune
          POSTGRES_PASSWORD: synctune
          POSTGRES_DB: synctune
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synctune"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://synctune:synctune@localhost:5432/synctune
          SPOTIFY_CLIENT_ID: ci
          SPOTIFY_CLIENT_SECRET: ci
          SPOTIFY_REDIRECT_URI: http://127.0.0.1:8000/api/spotify/callback
          YOUTUBE_API_KEY: ci
          SECRET_KEY: ci
          FRONTEND_ORIGIN: http://127.0.0.1:5173
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://synctune:synctune@localhost:5432/synctune
          SPOTIFY_CLIENT_ID: ci
          SPOTIFY_CLIENT_SECRET: ci
          SPOTIFY_REDIRECT_URI: http://127.0.0.1:8000/api/spotify/callback
          YOUTUBE_API_KEY: ci
          SECRET_KEY: ci
          FRONTEND_ORIGIN: http://127.0.0.1:5173
        run: pytest app/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm test
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
